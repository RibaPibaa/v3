
name: Build Garage Auction

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find and extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found in repository root"
            exit 1
          fi

          echo "Found archive: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Locate Gradle project
        id: locate
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in extracted ZIP"
            find project -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$BUILD_FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build mod
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GarageAuction-Park-Scrapyard-v2
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
